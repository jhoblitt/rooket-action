name: self-test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A literal prefix rather than github.workflow: a called workflow sees its
# caller's name, which would put two calls from one caller in one group.
concurrency:
  group: self-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The consumer ran actions/setup-go, so main builds the helper with that Go.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run the action
        id: rooket
        uses: ./

      - name: Check what the action left on the runner
        env:
          ROOKET_ACTION_PATH: ${{ steps.rooket.outputs.path }}
        run: go test -count=1 -tags selftest ./test/selftest/...

  # No actions/setup-go, so main builds the helper with the runner image's
  # own Go. The cluster is left up for the post step to tear down.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOKET_NAME: smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action
        uses: ./

      # The Rook release rooket's own e2e proves, bumped by hand.
      - name: Bring up a cluster
        run: rooket up --rook-version v1.20.7 --workers 1 --wait

      - name: Check Ceph's status
        run: rooket k -n rook-ceph exec deploy/rook-ceph-tools -- ceph -s
