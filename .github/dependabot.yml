version: 2
updates:
  # The Go entry, from go-conventions (references/ci.md, Dependabot), which
  # owns how it lands in .github/dependabot.yml.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    # Consumers build the helper from these modules, so a bump releases as a
    # patch, the way a rooket pin bump does.
    commit-message:
      prefix: fix
      include: scope
  # The GitHub Actions entry, from github-conventions (references/workflows.md,
  # Dependabot), which owns this file.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # semantic-release and its plugins, pinned by package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    # The preset's 10.x renders only through conventional-changelog-writer 9,
    # and release-notes-generator 14 still loads writer 8, so a 10.x bump
    # breaks every release. Move both together, by hand, once the generator
    # ships on writer 9.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
